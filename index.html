<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mobile Hymn Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7; --card: #fff; --primary: #1a73e8;
    --text: #1d1d1f; --muted: #6e6e73;
    --border: #d2d2d7; --danger: #d93025; --radius: 12px;
  }
  html, body { height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  /* ── LIST SCREEN ── */
  #list-screen { display: flex; flex-direction: column; flex: 1; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .topbar h1 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--primary); font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .search-bar { padding: 10px 16px 0; background: var(--card); }
  .search-bar input { width: 100%; border: 1px solid var(--border); border-radius: 50px; padding: 10px 16px; font-size: 15px; outline: none; background: var(--bg); }
  .search-bar input:focus { border-color: var(--primary); background: #fff; }
  .filter-bar { padding: 10px 16px 12px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
  .filter-btn { padding: 7px 14px; border-radius: 50px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .filter-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .bookmark-count { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  .list-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .slide-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid transparent; -webkit-tap-highlight-color: transparent; }
  .slide-card:active { border-color: var(--primary); }
  .slide-icon { width: 40px; height: 40px; border-radius: 10px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .slide-info { flex: 1; min-width: 0; }
  .slide-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slide-arrow { color: var(--border); font-size: 18px; flex-shrink: 0; margin-left: 4px; }
  .bookmark-btn { background: none; border: none; cursor: pointer; padding: 4px 6px; flex-shrink: 0; display: flex; align-items: center; -webkit-tap-highlight-color: transparent; }
  .bookmark-btn svg { width: 22px; height: 22px; transition: fill .15s, stroke .15s; }
  .bookmark-btn.bookmarked svg { fill: var(--primary); stroke: var(--primary); }
  .bookmark-btn:not(.bookmarked) svg { fill: none; stroke: #bbb; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; line-height: 1.5; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-banner { margin: 12px 16px; background: #fce8e6; border-radius: var(--radius); padding: 12px 16px; font-size: 14px; color: var(--danger); display: none; }

  /* ── VIEWER OVERLAY ── */
  #viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: #000;
    flex-direction: column;
  }
  #viewer.open { display: flex; }

  #viewer-topbar {
    background: #1a1a1a;
    border-bottom: 1px solid #333;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }
  #viewer-topbar h2 { font-size: 15px; font-weight: 600; color: #fff; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #back-btn { background: none; border: none; color: #aaa; font-size: 15px; cursor: pointer; padding: 4px 8px; -webkit-tap-highlight-color: transparent; white-space: nowrap; }

  #slide-frame {
    flex: 1;
    width: 100%;
    border: none;
    background: #000;
    pointer-events: none; /* gesture-layer handles ALL touch input */
  }

  #viewer-loading {
    position: absolute;
    inset: 0;
    top: 52px;
    background: #111;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
    transition: opacity 0.3s;
  }
  #viewer-loading .spinner { border-color: #444; border-top-color: #888; }
  #viewer-loading.hidden { display: none; }

  #gesture-layer {
    position: absolute;
    inset: 0;
    top: 52px;
    z-index: 20;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }

  .flash {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.2); border-radius: 50%;
    width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #fff; pointer-events: none;
    opacity: 0; transition: opacity 0.1s;
  }
  .flash.left { left: 16px; }
  .flash.right { right: 16px; }
  .flash.show { opacity: 1; }

  #counter {
    background: #1a1a1a;
    border-top: 1px solid #222;
    padding: 6px 16px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
    text-align: center;
    color: #555;
    font-size: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 30;
  }

  @media (orientation: landscape) {
    #viewer-topbar { display: none; }
    #counter { display: none; }
    #viewer-loading { top: 0; }
    #gesture-layer { top: 0; }
  }
</style>
</head>
<body>

<!-- LIST -->
<div id="list-screen">
  <div class="topbar">
    <h1>🎵 Mobile Hymn Viewer</h1>
    <button class="icon-btn" onclick="loadSlides()">🔄</button>
  </div>
  <div class="search-bar">
    <input type="search" id="search-input" placeholder="Search hymns…" oninput="filterSlides()" />
  </div>
  <div class="filter-bar">
    <button class="filter-btn" id="bookmark-filter-btn" onclick="toggleBookmarkFilter()">🔖 Bookmarked</button>
    <button class="filter-btn" onclick="resetBookmarks()">Reset All</button>
    <span class="bookmark-count" id="bookmark-count"></span>
  </div>
  <div id="error-banner" class="error-banner"></div>
  <div class="list-body" id="list-body">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
</div>

<!-- VIEWER (fixed overlay) -->
<div id="viewer">
  <div id="viewer-topbar">
    <button id="back-btn" onclick="closeViewer()">◀ Back</button>
    <h2 id="viewer-title"></h2>
  </div>
  <iframe id="slide-frame" allowfullscreen allow="autoplay" onload="onFrameLoad()"></iframe>
  <div id="counter">Slide 1</div>
  <div id="viewer-loading"><div class="spinner"></div></div>
  <div id="gesture-layer">
    <div class="flash left" id="flash-left">‹</div>
    <div class="flash right" id="flash-right">›</div>
  </div>
</div>

<script>
  const API_KEY   = 'AIzaSyCIS525yIhValgUn87JS8EIHbce6ur7pzg';
  const FOLDER_ID = '1xZ34slens8JkqfZ34tCdDLtgkC8yhl_d';

  let allSlides = [], showOnlyBookmarked = false;
  let bookmarks = JSON.parse(localStorage.getItem('hymn_bookmarks') || '{}');
  let currentSlide = 1, currentPresId = null;

  const BOOKMARK_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`;

  loadSlides();
  setupGestures();

  function openViewer(id, name) {
    currentPresId = id; currentSlide = 1;
    document.getElementById('viewer-title').textContent = name;
    document.getElementById('counter').textContent = 'Slide 1';
    document.getElementById('viewer-loading').classList.remove('hidden');
    document.getElementById('viewer').classList.add('open');
    setTimeout(() => {
      document.getElementById('slide-frame').src =
        `https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false&delayms=99999&rm=minimal`;
    }, 100);
  }

  function closeViewer() {
    document.getElementById('viewer').classList.remove('open');
    document.getElementById('slide-frame').src = 'about:blank';
    currentPresId = null;
  }

  function onFrameLoad() {
    const src = document.getElementById('slide-frame').src;
    if (!src || src === 'about:blank') return;
    document.getElementById('viewer-loading').classList.add('hidden');
  }

  function prevSlide() {
    if (currentSlide <= 1) return;
    currentSlide--;
    document.getElementById('counter').textContent = `Slide ${currentSlide}`;
    flash('left');
    reloadFrame();
  }

  function nextSlide() {
    currentSlide++;
    document.getElementById('counter').textContent = `Slide ${currentSlide}`;
    flash('right');
    reloadFrame();
  }

  function reloadFrame() {
    document.getElementById('viewer-loading').classList.remove('hidden');
    document.getElementById('slide-frame').src =
      `https://docs.google.com/presentation/d/${currentPresId}/embed?start=false&loop=false&delayms=99999&rm=minimal&slide=id.p${currentSlide}`;
  }

  function flash(side) {
    const el = document.getElementById('flash-' + side);
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 250);
  }

  function setupGestures() {
    const layer = document.getElementById('gesture-layer');
    let x0 = 0, y0 = 0, t0 = 0;

    layer.addEventListener('touchstart', e => {
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
      t0 = Date.now();
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });

    layer.addEventListener('touchmove', e => {
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });

    layer.addEventListener('touchend', e => {
      const x1 = e.changedTouches[0].clientX;
      const y1 = e.changedTouches[0].clientY;
      const dx = x1 - x0, dy = y1 - y0;
      const dt = Date.now() - t0;
      const ax = Math.abs(dx), ay = Math.abs(dy);

      e.preventDefault();
      e.stopPropagation();

      if (ax < 14 && ay < 14 && dt < 300) {
        const w = window.innerWidth;
        if (x1 < w * 0.4) prevSlide();
        else if (x1 > w * 0.6) nextSlide();
        return;
      }

      if (ax > 30 && ax > ay * 1.2 && dt < 500) {
        if (dx < 0) nextSlide();
        else prevSlide();
      }
    }, { passive: false });

    layer.addEventListener('click', e => {
      const w = window.innerWidth;
      if (e.clientX < w * 0.4) prevSlide();
      else if (e.clientX > w * 0.6) nextSlide();
    });
  }

  async function loadSlides() {
    hideError();
    document.getElementById('list-body').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
    const mimeQ = ["mimeType='application/vnd.google-apps.presentation'","mimeType='application/vnd.ms-powerpoint'","mimeType='application/vnd.openxmlformats-officedocument.presentationml.presentation'"].join(' or ');
    const q = `'${FOLDER_ID}' in parents and (${mimeQ}) and trashed=false`;
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('files(id,name,mimeType)')}&orderBy=name&pageSize=200&key=${encodeURIComponent(API_KEY)}`;
    try {
      const res = await fetch(url); const data = await res.json();
      if (data.error) { showError('Drive API error: ' + data.error.message); document.getElementById('list-body').innerHTML = ''; return; }
      allSlides = data.files || []; renderSlides(getFilteredSlides()); updateBookmarkCount();
    } catch(e) { showError('Network error: ' + e.message); document.getElementById('list-body').innerHTML = ''; }
  }

  function renderSlides(slides) {
    const body = document.getElementById('list-body');
    if (!slides.length) { body.innerHTML = showOnlyBookmarked ? '<div class="empty-state"><div class="emoji">🔖</div><p>No bookmarked hymns yet.</p></div>' : '<div class="empty-state"><div class="emoji">🔍</div><p>No hymns found.</p></div>'; return; }
    body.innerHTML = '';
    slides.forEach(s => {
      const isBookmarked = !!bookmarks[s.id];
      const card = document.createElement('div');
      card.className = 'slide-card';
      card.innerHTML = `<div class="slide-icon">🎵</div><div class="slide-info"><div class="slide-name">${escHtml(s.name)}</div></div><button class="bookmark-btn ${isBookmarked ? 'bookmarked' : ''}">${BOOKMARK_SVG}</button><div class="slide-arrow">›</div>`;
      card.addEventListener('click', e => { if (!e.target.closest('.bookmark-btn')) openViewer(s.id, s.name); });
      card.querySelector('.bookmark-btn').addEventListener('click', e => { e.stopPropagation(); toggleBookmark(s.id, e.currentTarget); });
      body.appendChild(card);
    });
  }

  function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function getFilteredSlides() { const q = document.getElementById('search-input').value.toLowerCase(); let s = allSlides; if (showOnlyBookmarked) s = s.filter(x => bookmarks[x.id]); if (q) s = s.filter(x => x.name.toLowerCase().includes(q)); return s; }
  function filterSlides() { renderSlides(getFilteredSlides()); }
  function toggleBookmarkFilter() { showOnlyBookmarked = !showOnlyBookmarked; document.getElementById('bookmark-filter-btn').classList.toggle('active', showOnlyBookmarked); renderSlides(getFilteredSlides()); }
  function resetBookmarks() { if (!Object.keys(bookmarks).length) return; if (!confirm('Remove all bookmarks?')) return; bookmarks = {}; saveBookmarks(); updateBookmarkCount(); showOnlyBookmarked = false; document.getElementById('bookmark-filter-btn').classList.remove('active'); renderSlides(getFilteredSlides()); }
  function toggleBookmark(id, btn) { if (bookmarks[id]) { delete bookmarks[id]; btn.classList.remove('bookmarked'); } else { bookmarks[id] = true; btn.classList.add('bookmarked'); } saveBookmarks(); updateBookmarkCount(); if (showOnlyBookmarked) renderSlides(getFilteredSlides()); }
  function saveBookmarks() { localStorage.setItem('hymn_bookmarks', JSON.stringify(bookmarks)); }
  function updateBookmarkCount() { const c = Object.keys(bookmarks).length; document.getElementById('bookmark-count').textContent = c > 0 ? `${c} bookmarked` : ''; }
  function showError(msg) { const el = document.getElementById('error-banner'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('error-banner').style.display = 'none'; }
</script>
</body>
</html>
