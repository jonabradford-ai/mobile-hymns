<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hymns</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7; --card: #ffffff; --primary: #1a73e8;
    --primary-dark: #1557b0; --text: #1d1d1f; --muted: #6e6e73;
    --border: #d2d2d7; --danger: #d93025; --radius: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
  .topbar h1 { font-size: 18px; font-weight: 600; flex: 1; }
  .icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--primary); font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .icon-btn:hover { background: var(--bg); }
  .screen { display: none; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }
  .search-bar { padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .search-bar input { width: 100%; border: 1px solid var(--border); border-radius: 50px; padding: 10px 16px; font-size: 15px; outline: none; background: var(--bg); }
  .search-bar input:focus { border-color: var(--primary); background: #fff; }
  .list-body { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .slide-card { background: var(--card); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border: 1px solid transparent; transition: border-color .15s, box-shadow .15s; }
  .slide-card:hover, .slide-card:active { border-color: var(--primary); box-shadow: 0 2px 8px rgba(26,115,232,.12); }
  .slide-icon { width: 44px; height: 44px; border-radius: 10px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 22px; }
  .slide-info { flex: 1; min-width: 0; }
  .slide-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slide-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .slide-arrow { color: var(--border); font-size: 18px; flex-shrink: 0; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .emoji { font-size: 40px; margin-bottom: 12px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-banner { margin: 12px 16px; background: #fce8e6; border-radius: var(--radius); padding: 12px 16px; font-size: 14px; color: var(--danger); display: none; }
  #viewer-screen { background: #000; }
  #viewer-screen .topbar { background: #1a1a1a; border-color: #333; color: #fff; }
  #viewer-screen .topbar h1 { color: #fff; font-size: 15px; }
  #viewer-screen .icon-btn { color: #aaa; }
  #viewer-screen .icon-btn:hover { background: #333; }
  #slide-frame { flex: 1; width: 100%; border: none; background: #000; display: none; }
  .frame-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; gap: 12px; font-size: 15px; background: #111; }
  .frame-placeholder .spinner { border-color: #444; border-top-color: #888; }
</style>
</head>
<body>

<div class="screen active" id="list-screen">
  <div class="topbar">
    <h1>🎵 Hymns</h1>
    <button class="icon-btn" onclick="loadSlides()">🔄</button>
  </div>
  <div class="search-bar">
    <input type="search" id="search-input" placeholder="Search hymns…" oninput="filterSlides()" />
  </div>
  <div id="error-banner" class="error-banner"></div>
  <div class="list-body" id="list-body">
    <div class="loading"><div class="spinner"></div>Loading…</div>
  </div>
</div>

<div class="screen" id="viewer-screen">
  <div class="topbar">
    <button class="icon-btn" onclick="showList()">◀ Back</button>
    <h1 id="viewer-title">Presentation</h1>
    <a class="icon-btn" id="open-external-btn" href="#" target="_blank">↗</a>
  </div>
  <div class="frame-placeholder" id="frame-placeholder">
    <div class="spinner"></div>
    <span>Loading…</span>
  </div>
  <iframe id="slide-frame" allowfullscreen allow="autoplay" onload="onFrameLoad()"></iframe>
</div>

<script>
  const API_KEY   = 'AIzaSyCIS525yIhValgUn87JS8EIHbce6ur7pzg';
  const FOLDER_ID = '1xZ34slens8JkqfZ34tCdDLtgkC8yhl_d';

  let allSlides = [];

  loadSlides();

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showList() {
    const frame = document.getElementById('slide-frame');
    frame.src = ''; frame.style.display = 'none';
    document.getElementById('frame-placeholder').style.display = 'flex';
    showScreen('list-screen');
  }

  async function loadSlides() {
    hideError();
    document.getElementById('list-body').innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';
    const mimeQ = [
      "mimeType='application/vnd.google-apps.presentation'",
      "mimeType='application/vnd.ms-powerpoint'",
      "mimeType='application/vnd.openxmlformats-officedocument.presentationml.presentation'"
    ].join(' or ');
    const q = `'${FOLDER_ID}' in parents and (${mimeQ}) and trashed=false`;
    const fields = 'files(id,name,mimeType,modifiedTime,webViewLink)';
    const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(fields)}&orderBy=name&pageSize=200&key=${encodeURIComponent(API_KEY)}`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (data.error) { showError('Error: ' + data.error.message); document.getElementById('list-body').innerHTML = ''; return; }
      allSlides = data.files || [];
      renderSlides(allSlides);
    } catch(e) {
      showError('Network error: ' + e.message);
      document.getElementById('list-body').innerHTML = '';
    }
  }

  function renderSlides(slides) {
    const body = document.getElementById('list-body');
    if (!slides.length) {
      body.innerHTML = '<div class="empty-state"><div class="emoji">🔍</div><p>No hymns found.</p></div>';
      return;
    }
    body.innerHTML = '';
    slides.forEach(s => {
      const isGSlides = s.mimeType === 'application/vnd.google-apps.presentation';
      const card = document.createElement('div');
      card.className = 'slide-card';
      card.innerHTML = `
        <div class="slide-icon">${isGSlides ? '🎵' : '📊'}</div>
        <div class="slide-info">
          <div class="slide-name">${escHtml(s.name)}</div>
        </div>
        <div class="slide-arrow">›</div>`;
      card.addEventListener('click', () => openSlide(s.id, s.name, s.mimeType, s.webViewLink || ''));
      body.appendChild(card);
    });
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function filterSlides() {
    const q = document.getElementById('search-input').value.toLowerCase();
    renderSlides(q ? allSlides.filter(s => s.name.toLowerCase().includes(q)) : allSlides);
  }

  function openSlide(id, name, mimeType, webViewLink) {
    document.getElementById('viewer-title').textContent = name;
    let embedUrl;
    if (mimeType === 'application/vnd.google-apps.presentation') {
      embedUrl = `https://docs.google.com/presentation/d/${id}/embed?start=false&loop=false&delayms=3000&rm=minimal`;
    } else {
      embedUrl = `https://docs.google.com/viewer?srcid=${id}&pid=explorer&efh=false&a=v&chrome=false&embedded=true`;
    }
    document.getElementById('open-external-btn').href = webViewLink || `https://docs.google.com/presentation/d/${id}/edit`;
    const placeholder = document.getElementById('frame-placeholder');
    const frame = document.getElementById('slide-frame');
    placeholder.style.display = 'flex';
    frame.style.display = 'none';
    frame.src = '';
    showScreen('viewer-screen');
    setTimeout(() => { frame.src = embedUrl; }, 200);
  }

  function onFrameLoad() {
    document.getElementById('frame-placeholder').style.display = 'none';
    document.getElementById('slide-frame').style.display = 'block';
  }

  function showError(msg) { const el = document.getElementById('error-banner'); el.textContent = msg; el.style.display = 'block'; }
  function hideError() { document.getElementById('error-banner').style.display = 'none'; }
</script>
</body>
</html>
